[workspace]
members = ["xtask"]

[package]
name = "lemma"
version = "0.1.0"
edition = "2021"
authors = ["Beat Weber <beat.weber@bithawk.ch>"]
license = "GPL-3.0-or-later"
description = "Harmonic amp, reverb with ping-pong delay, key-tracking harmonic EQ and filter"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "0.1"
triple_buffer = "6.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dev-dependencies]
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "9a0b42c09d712777b2edb4c5e0cb6baf21e988f0" }
egui-baseview = { git = "https://github.com/BillyDM/egui-baseview.git", rev = "ec70c3fe6b2f070dcacbc22924431edbe24bd1c0", features = ["opengl"] }
